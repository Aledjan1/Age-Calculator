
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Calculator</title>
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <main class="calculator">
    <h1>Age Calculator</h1>
    <p>Discover how long you've been alive!</p>

    <label for="age">Enter your age in years</label>
    <input type="number" id="age" min="0" placeholder="e.g. 18">

    <button class="calculate-btn">Calculate Age</button>

    <section class="results">
      <div class="result">
        <h2 class="months">---</h2>
        <p>Months</p>
      </div>
      <div class="result">
        <h2 class="weeks">---</h2>
        <p>Weeks</p>
      </div>
      <div class="result">
        <h2 class="days">---</h2>
        <p>Days</p>
      </div>
      <div class="result">
        <h2 class="hours">---</h2>
        <p>Hours</p>
      </div>
    </section>
  </main>
  <script src="index.js"></script>
</body>

</html>
